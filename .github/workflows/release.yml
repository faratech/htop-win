name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.0.1); dispatch from main only'
        required: true
        type: string

# Each job asks for what it needs: only `build` (in the `release` environment)
# signs and attests, and only `release` can write the GitHub release.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      prerelease: ${{ steps.source.outputs.prerelease }}

    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch; toolchain set explicitly
        with:
          toolchain: 1.99.0

      - name: Resolve and validate release source
        id: source
        shell: bash
        env:
          SELECTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          TAG="$SELECTED_TAG"
          if ! git check-ref-format "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "Release tag does not exist: $TAG" >&2
            exit 1
          fi

          SHA="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"

          # Only reviewed code reaches the signing job: the tagged commit must
          # be on main, and a manual run must itself come from main.
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Dispatch this workflow from main, not $GITHUB_REF" >&2
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$SHA" refs/remotes/origin/main; then
            echo "Release tag $TAG ($SHA) is not on main" >&2
            exit 1
          fi

          git checkout --detach "$SHA"
          PACKAGE_VERSION="$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "htop-win") | .version')"

          TAG="$TAG" PACKAGE_VERSION="$PACKAGE_VERSION" python3 - <<'PY'
          import os
          import re

          tag = os.environ["TAG"]
          package_version = os.environ["PACKAGE_VERSION"]
          if not tag.startswith("v"):
              raise SystemExit(f"Release tag must start with 'v': {tag}")

          tag_version = tag[1:]
          semver = re.compile(
              r"(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)"
              r"(?:-(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)"
              r"(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*)?"
              r"(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?"
          )
          match = semver.fullmatch(tag_version)
          if match is None:
              raise SystemExit(f"Release tag is not strict SemVer: {tag}")
          if any(int(component) > 65535 for component in match.groups()[:3]):
              raise SystemExit(
                  f"Release tag {tag} exceeds the Windows resource component limit of 65535"
              )
          if tag_version != package_version:
              raise SystemExit(
                  f"Tag/package version mismatch: {tag_version} != {package_version}"
              )
          PY

          {
            echo "tag=$TAG"
            echo "sha=$SHA"
            echo "version=$PACKAGE_VERSION"
          } >> "$GITHUB_OUTPUT"
          VERSION_WITHOUT_BUILD="${PACKAGE_VERSION%%+*}"
          if [[ "$VERSION_WITHOUT_BUILD" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Release source: $TAG ($SHA), package $PACKAGE_VERSION" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: prepare
    # Holds the Trusted Signing credentials. Create the environment with
    # required reviewers and v* tag / main deployment refs, and move the
    # AZURE_* secrets into it (see the PR's Ops follow-ups).
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: amd64
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            arch: arm64
            os: windows-latest

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Verify release source
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "Building ${{ needs.prepare.outputs.tag }} from $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch; toolchain set explicitly
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          $src = "target/${{ matrix.target }}/release/htop-win.exe"
          $dst = "htop-win-${{ matrix.arch }}.exe"
          Copy-Item $src $dst
          [ordered]@{
            tag = $env:RELEASE_TAG
            sha = $env:RELEASE_SHA
            version = $env:RELEASE_VERSION
            target = $env:BUILD_TARGET
          } | ConvertTo-Json | Set-Content -NoNewline "htop-win-${{ matrix.arch }}.source.json"

      - name: Sign with Fara Technologies LLC (primary)
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0 (formerly Azure/trusted-signing-action)
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: 'https://eus.codesigning.azure.net/'
          trusted-signing-account-name: 'faraCodeSigningBusiness'
          certificate-profile-name: 'Faratech'
          files: |
            ${{ github.workspace }}\htop-win-${{ matrix.arch }}.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Append Mike Fara signature
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0 (formerly Azure/trusted-signing-action)
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: 'https://eus.codesigning.azure.net/'
          trusted-signing-account-name: 'fara-codesigning'
          certificate-profile-name: 'MikeFara'
          files: |
            ${{ github.workspace }}\htop-win-${{ matrix.arch }}.exe
          append-signature: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify both embedded signatures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if (-not $tool) { throw 'x64 signtool.exe not found' }
          $files = @(Get-Item -LiteralPath 'htop-win-${{ matrix.arch }}.exe')
          if ($files.Count -eq 0) { throw 'No signed executables found' }
          foreach ($file in $files) {
            & $tool.FullName verify /pa /all /v $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed: $file" }
            & $tool.FullName verify /pa /ds 1 $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Second signature missing or invalid: $file" }
          }

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: htop-win-${{ matrix.arch }}.exe

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: htop-win-${{ matrix.arch }}-${{ needs.prepare.outputs.sha }}
          path: |
            htop-win-${{ matrix.arch }}.exe
            htop-win-${{ matrix.arch }}.source.json

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0  # Need full history to access tag annotations

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Get tag message
        id: tag_message
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify "refs/tags/$TAG^{commit}")" = "$EXPECTED_SHA"
          git for-each-ref --format='%(contents)' "refs/tags/$TAG" > release_notes.md
          # --owner alone would accept an attestation from any faratech repo;
          # bind it to this repository's release workflow and this run's ref.
          {
            echo
            echo "### Verification"
            echo
            echo "All release binaries are signed with Azure Trusted Signing and carry a build-provenance attestation from this repository's release workflow:"
            echo
            echo '```bash'
            for arch in amd64 arm64; do
              echo "gh attestation verify htop-win-$arch.exe --repo faratech/htop-win --signer-workflow faratech/htop-win/.github/workflows/release.yml --source-ref $SOURCE_REF"
            done
            echo '```'
          } >> release_notes.md
          echo "Generated release notes for $TAG"

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: htop-win ${{ needs.prepare.outputs.tag }}
          draft: false
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          files: |
            artifacts/htop-win-amd64.exe
            artifacts/htop-win-amd64.source.json
            artifacts/htop-win-arm64.exe
            artifacts/htop-win-arm64.source.json
          body_path: release_notes.md
